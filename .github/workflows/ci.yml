name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
