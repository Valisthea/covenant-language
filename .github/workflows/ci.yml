name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Follows rust-toolchain.toml (channel = "stable") so local and CI
      # run the same compiler. Hardcoding a version here diverged from the
      # toolchain file and made clippy pass locally while failing in CI.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Proves compiler output runs on a real EVM, not just that the test harness
  # compiles it. Compiles a token, deploys the emitted bytecode to a local
  # anvil, and exercises the ERC-20 surface with on-chain assertions. This is
  # the compiler-to-chain gate the internal review found missing: every other
  # on-chain check was a direct call to a deployed helper.
  e2e-anvil:
    name: end-to-end on anvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cargo build --release --bin covenant
      - run: bash scripts/e2e-anvil.sh
