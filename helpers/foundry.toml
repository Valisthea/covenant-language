[profile.default]
src              = "src"
test             = "test"
script           = "script"
out              = "out"
libs             = ["lib"]
solc             = "0.8.24"
optimizer        = true
optimizer_runs   = 200
via_ir           = false
auto_detect_solc = false
fs_permissions   = [{ access = "read-write", path = "./config" }]

# Sprint 30 / V0.9 Phase A.1
# Ship target: Sepolia (chainid 11155111)
# Mainnet (chainid 1) is hard-rejected by every Mocked* helper at runtime.

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
aster   = "${ASTER_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length      = 100
tab_width        = 4
bracket_spacing  = false
int_types        = "long"
quote_style      = "double"
number_underscore = "preserve"
