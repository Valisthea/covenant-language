[package]
description = "EVM bytecode backend for the Covenant compiler"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["compiler", "evm", "smart-contracts", "covenant"]
categories = ["development-tools", "cryptography"]
name = "covenant-evm-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
covenant-ir = { path = "../covenant-ir", version = "0.9.2" }
covenant-privacy = { path = "../covenant-privacy", version = "0.9.2" }
covenant-types = { path = "../covenant-types", version = "0.9.2" }
covenant-parser = { path = "../covenant-parser", version = "0.9.2" }
covenant-diag = { path = "../covenant-diag", version = "0.9.2" }
sha3 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
covenant-resolver = { path = "../covenant-resolver", version = "0.9.2" }
covenant-lexer = { path = "../covenant-lexer", version = "0.9.2" }
covenant-opt = { path = "../covenant-opt", version = "0.9.2" }
covenant-stdlib = { path = "../covenant-stdlib", version = "0.9.2" }
# The mini-EVM interpreter, so backend regression tests can assert what the
# emitted bytecode actually DOES rather than only which opcodes it contains.
# It has no covenant dependencies of its own, so this adds no cycle.
covenant-evm-runtime = { path = "../covenant-evm-runtime", version = "0.9.2" }
hex = "0.4"
