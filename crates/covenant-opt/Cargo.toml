[package]
description = "Optimizer passes (DCE, CSE) for the Covenant compiler"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["compiler", "optimizer", "smart-contracts", "covenant"]
categories = ["development-tools"]
name = "covenant-opt"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
covenant-ir = { path = "../covenant-ir", version = "0.9.2" }
covenant-privacy = { path = "../covenant-privacy", version = "0.9.2" }
covenant-types = { path = "../covenant-types", version = "0.9.2" }
covenant-parser = { path = "../covenant-parser", version = "0.9.2" }
covenant-diag = { path = "../covenant-diag", version = "0.9.2" }
thiserror = { workspace = true }

[dev-dependencies]
covenant-resolver = { path = "../covenant-resolver", version = "0.9.2" }
covenant-lexer = { path = "../covenant-lexer", version = "0.9.2" }
