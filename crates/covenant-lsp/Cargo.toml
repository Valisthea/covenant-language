[package]
description = "Language server (LSP) for the Covenant smart contract language"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lsp", "smart-contracts", "ide", "covenant"]
categories = ["development-tools"]
name = "covenant-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "covenant_lsp"
path = "src/lib.rs"

[[bin]]
name = "covenant-lsp"
path = "src/main.rs"

[dependencies]
covenant-driver = { path = "../covenant-driver", version = "0.9.2" }
covenant-lexer = { path = "../covenant-lexer", version = "0.9.2" }
covenant-parser = { path = "../covenant-parser", version = "0.9.2" }
covenant-diag = { path = "../covenant-diag", version = "0.9.2" }
covenant-lint = { path = "../covenant-lint", version = "0.9.2" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
