[package]
name = "covenant-wasm-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WASM bindings for running the Covenant compiler in a browser (covenant-playground)"
keywords = ["covenant", "compiler", "wasm", "playground"]
categories = ["wasm", "compilers", "development-tools"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Compiler surface: keep this list minimal. Every extra crate is bytes
# in the user's browser.
covenant-driver = { path = "../covenant-driver", version = "0.9.2" }
covenant-diag = { path = "../covenant-diag", version = "0.9.2" }
covenant-evm-backend = { path = "../covenant-evm-backend", version = "0.9.2" }
covenant-evm-runtime = { path = "../covenant-evm-runtime", version = "0.9.2" }
covenant-ir = { path = "../covenant-ir", version = "0.9.2" }
covenant-opt = { path = "../covenant-opt", version = "0.9.2" }
covenant-stdlib = { path = "../covenant-stdlib", version = "0.9.2" }

# Direct dep so chain_bindings can hex-encode return data without
# going through covenant-evm-runtime (which already pulls hex but
# keeps it as an internal impl detail).
hex = "0.4"

# Aster + wasm backends are deliberately NOT pulled in. They add weight
# without giving the browser playground anything actionable.

# JS interop bindings: all expensive ones gated to wasm32 so native
# `cargo test` doesn't have to compile them.
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.95"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
panic-hook = ["dep:console_error_panic_hook"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory"]
